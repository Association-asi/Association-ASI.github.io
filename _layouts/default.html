    <!-- SCRIPTS -->
    <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
    </script>

<script>
document.addEventListener('DOMContentLoaded', function() {

  var mainContent = document.getElementById('content');
  var header = document.querySelector('.page-header');
  var footerContent = document.getElementById('footer-content');
  var footerBar = document.querySelector('.footer-handle-bar');

  /* ====== FONCTIONS COLLAPSE / EXPAND ====== */
  function collapse() {
    header && header.classList.add('header-collapsed');
    footerContent && footerContent.classList.add('collapsed');
    footerBar && footerBar.classList.add('collapsed');
    sessionStorage.setItem('asi-collapsed', 'true');
  }

  function expand() {
    header && header.classList.remove('header-collapsed');
    footerContent && footerContent.classList.remove('collapsed');
    footerBar && footerBar.classList.remove('collapsed');
    sessionStorage.setItem('asi-collapsed', 'false');
  }

  /* ====== APPLIQUER L'ÉTAT AU CHARGEMENT DE LA PAGE ====== */
  if (sessionStorage.getItem('asi-collapsed') === 'true') {
    collapse();
  }

  /* ====== CLIC SUR UN LIEN DE NAV → COLLAPSE PERMANENT ====== */
  var allNavLinks = document.querySelectorAll(
    '.nav-link, .footer-nav a, .footer-legal a'
  );

  allNavLinks.forEach(function(link) {
    link.addEventListener('click', function() {
      sessionStorage.setItem('asi-collapsed', 'true');
    });
  });

  /* ====== POIGNÉE FOOTER = TOGGLE MANUEL ====== */
  var handle = document.getElementById('footer-handle');
  if (handle) {
    handle.addEventListener('click', function(e) {
      e.stopPropagation();
      if (sessionStorage.getItem('asi-collapsed') === 'true') {
        expand();
      } else {
        collapse();
      }
    });
  }

  /* ====== TAP SUR LE CONTENU = RE-EXPAND ====== */
  if (mainContent) {
    mainContent.addEventListener('click', function(e) {
      if (e.target.tagName !== 'A' && e.target.tagName !== 'BUTTON') {
        if (sessionStorage.getItem('asi-collapsed') === 'true') {
          expand();
        }
      }
    });
  }

});
</script>
  </body>
</html>
