<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <title>{{ page.title | default: site.title }}</title>
    <!-- Netlify Identity pour le CMS -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>

  <body class="fixed-layout">

    <!-- EN-TÊTE -->
    <header class="page-header" role="banner">
      <div class="header-inner">
        <img src="{{ '/ASI2.jpeg' | relative_url }}"
             alt="Logo ASI"
             class="header-logo">
        <div class="header-text">
          <h1 class="project-name">{{ site.title }}</h1>
          <h2 class="project-tagline">{{ site.description }}</h2>
        </div>
      </div>
    </header>

    <!-- CONTENU PRINCIPAL -->
    <main id="content" class="main-content scrollable" role="main">
      {{ content }}
    </main>

    <!-- PIED DE PAGE -->
    <footer class="site-footer">
      <nav class="footer-nav">
        <a href="/">🏠 Accueil</a>
        <a href="/about">À propos</a>
        <a href="/adhesion">Adhésion</a>
        <a href="/contact">Contact</a>
        <a href="/plaquettes.pdf" target="_blank">📄 Plaquette</a>
      </nav>
       <nav class="footer-legal">
         <a href="/mentions-legales">Mentions légales</a>
         <a href="/politique-confidentialite">Politique de confidentialité</a>
      </nav>      
      <span class="site-footer-credits">
        © {{ site.title }} — Généré par
        <a href="https://pages.github.com" target="_blank">GitHub Pages</a>
      </span>
    </footer>

    <!-- Script Netlify Identity -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>

  </body>
</html>
