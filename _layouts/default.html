<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <title>{{ page.title | default: site.title }}</title>
  </head>

  <body class="fixed-layout">

    <header class="page-header" role="banner">
      <div class="header-inner">
        <img src="{{ '/ASI2.jpeg' | relative_url }}" 
             alt="Logo ASI" 
             class="header-logo">
        <div class="header-text">
          <h1 class="project-name">{{ site.title }}</h1>
          <h2 class="project-tagline">{{ site.description }}</h2>
        </div>
      </div>
    </header>

    <main id="content" class="main-content scrollable" role="main">
      {{ content }}
    </main>

    <footer class="site-footer">
       <div class="footer-image-container">
    <img src="/ASI99.jpeg" alt="Solidarité ASI" class="footer-image">
    <div class="footer-overlay">
      <nav class="footer-nav">
        <a href="/">🏠 Accueil</a>
        <a href="/about">À propos</a>
        <a href="/adhesion">Adhésion</a>
        <a href="/contact">Contact</a>
<a href="/ASSOCIATION_PLAQUETTE.pdf" target="_blank">📄 Plaquette</a>      
      </nav>
      <span class="site-footer-credits">
        © {{ site.title }} — Généré par 
        <a href="https://pages.github.com">GitHub Pages</a>
      </span>
    </footer>

  </body>
</html>
