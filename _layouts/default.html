<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>{{ page.title | default: site.title }}</title>
    <!-- Netlify Identity pour le CMS -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>

  <body class="fixed-layout">

    <!-- EN-TÊTE -->
    <header class="page-header" role="banner">
      <div class="header-inner">
        <img src="{{ '/ASI2.jpeg' | relative_url }}"
             alt="Logo ASI"
             class="header-logo">
        <div class="header-text">
          <h1 class="project-name">{{ site.title }}</h1>
          <h2 class="project-tagline">{{ site.description }}</h2>
        </div>
      </div>
    </header>

    <!-- CONTENU PRINCIPAL -->
    <main id="content" class="main-content scrollable" role="main">
      {{ content }}
    </main>

    <!-- PIED DE PAGE -->
    <footer class="site-footer" id="site-footer">
  <div class="footer-handle" id="footer-handle">
    <span class="footer-handle-bar"></span>
  </div>
  <div class="footer-content" id="footer-content">

     <!-- RÉSEAUX SOCIAUX -->
    <div class="social-nav">
      <a href="#" target="_blank" class="social-btn facebook"
         title="Facebook ASI">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
      <a href="#" target="_blank" class="social-btn instagram"
         title="Instagram ASI">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="#" target="_blank" class="social-btn twitter"
         title="X (Twitter) ASI">
        <i class="fa-brands fa-x-twitter"></i>
      </a>
      <a href="#" target="_blank" class="social-btn youtube"
         title="YouTube ASI">
        <i class="fa-brands fa-youtube"></i>
      </a>
      <a href="#" target="_blank" class="social-btn linkedin"
         title="LinkedIn ASI">
        <i class="fa-brands fa-linkedin-in"></i>
      </a>
      <a href="#" target="_blank" class="social-btn whatsapp"
         title="WhatsApp ASI">
        <i class="fa-brands fa-whatsapp"></i>
      </a>
    </div>
    
      <nav class="footer-nav">
         <a href="/"><i class="fa-solid fa-house"></i> Accueil</a>
         <a href="/actualites"><i class="fa-solid fa-newspaper"></i> Actualités</a>
         <a href="/galerie"><i class="fa-solid fa-images"></i> Galerie</a>
         <a href="/about"><i class="fa-solid fa-circle-info"></i> À propos</a>
         <a href="/adhesion"><i class="fa-solid fa-handshake"></i> Adhésion</a>
         <a href="/contact"><i class="fa-solid fa-envelope"></i> Contact</a>
         <a href="/plaquettes.pdf" target="_blank">
            <i class="fa-solid fa-file-pdf"></i> Plaquette
         <a href="/partenaires">
        <i class="fa-solid fa-handshake"></i> Partenaires

         </a>
       </nav>
       <nav class="footer-legal">
         <a href="/mentions-legales">
            <i class="fa-solid fa-scale-balanced"></i> Mentions légales
         </a>
         <a href="/politique-confidentialite">
            <i class="fa-solid fa-shield-halved"></i> Politique de confidentialité
         </a>
       </nav>      
      <span class="site-footer-credits">
        © {{ site.title }} — Généré par
        <a href="https://pages.github.com" target="_blank">GitHub Pages</a>
      </span>
    </div>
    </footer>

    <!-- Script Netlify Identity -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
<script>
document.addEventListener('DOMContentLoaded', function() {

  var mainContent = document.getElementById('content');
  var header = document.querySelector('.page-header');
  var footerContent = document.getElementById('footer-content');
  var footerBar = document.querySelector('.footer-handle-bar');
  var isCollapsed = false;

  function collapse() {
    if (!isCollapsed) {
      isCollapsed = true;
      // Monter le header
      if (header) header.classList.add('header-collapsed');
      // Abaisser le footer
      if (footerContent) {
        footerContent.classList.add('collapsed');
        if (footerBar) footerBar.classList.add('collapsed');
      }
    }
  }

  function expand() {
    isCollapsed = false;
    // Descendre le header
    if (header) header.classList.remove('header-collapsed');
    // Remonter le footer
    if (footerContent) {
      footerContent.classList.remove('collapsed');
      if (footerBar) footerBar.classList.remove('collapsed');
    }
  }

  if (mainContent) {
    // Desktop — survol souris
    mainContent.addEventListener('mouseenter', collapse);
    mainContent.addEventListener('mouseleave', expand);

    // Mobile/tablette — tap sur le contenu
    mainContent.addEventListener('click', function(e) {
      // Ne pas déclencher si clic sur un lien ou bouton
      if (e.target.tagName !== 'A' && e.target.tagName !== 'BUTTON') {
        if (isCollapsed) {
          expand();
        } else {
          collapse();
        }
      }
    });
  }

  // Footer manuel — poignée
  var handle = document.getElementById('footer-handle');
  if (handle && footerContent) {
    handle.addEventListener('click', function(e) {
      e.stopPropagation();
      if (footerContent.classList.contains('collapsed')) {
        footerContent.classList.remove('collapsed');
        if (footerBar) footerBar.classList.remove('collapsed');
        isCollapsed = false;
      } else {
        footerContent.classList.add('collapsed');
        if (footerBar) footerBar.classList.add('collapsed');
        isCollapsed = true;
      }
    });
  }

});
</script>
   </body>
</html>
